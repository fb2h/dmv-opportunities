# TEMPORARY PRODUCTION FREEZE (Round 1.2 / contract 2.4.2)
#
# The legacy autocheck.py + build.py path does NOT implement the 2.4
# approval/membership model. Until an explicit owner-reviewed
# migration/activation round:
#   - this workflow does NOT run on a nightly schedule
#   - this workflow does NOT run on push to main (merging Round 1
#     must not rebuild or deploy GitHub Pages)
#   - there is NO Pages deployment job and NO workflow input that can
#     deploy the frozen 2.3 builder
#   - the currently deployed GitHub Pages site remains untouched
#   - production publication is explicitly inactive
#   - Round 1 review is NOT activated against production data
#
# Manual path: workflow_dispatch only. The only optional action is a
# non-publishing frozen 2.3 autocheck without live-link monitoring.
name: Legacy production (frozen)

on:
  workflow_dispatch:
    inputs:
      run_legacy_autocheck:
        description: "TEMPORARY FREEZE. Run the frozen 2.3 autocheck.py WITHOUT live-link checks. Does not publish, does not deploy, and does not use the Round 1 review path against production."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  freeze-status:
    runs-on: ubuntu-latest
    steps:
      - name: Record that production publication is frozen
        run: |
          echo "Production publication is explicitly inactive."
          echo "Nightly schedule: removed."
          echo "Push-to-main trigger: removed."
          echo "Legacy Pages deploy job: removed."
          echo "Existing GitHub Pages site: not modified by this workflow."
          echo "run_legacy_autocheck=${{ github.event.inputs.run_legacy_autocheck }}"

  legacy-autocheck:
    if: ${{ github.event.inputs.run_legacy_autocheck == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Frozen 2.3 invariant checks (no live-link monitor)
        run: python scripts/autocheck.py
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-autocheck-report
          path: data/meta/autocheck_report.json
