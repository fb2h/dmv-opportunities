name: Check, build and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"      # nightly, 06:17 UTC (about 2:17 am Eastern)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      - name: Invariant checks (with live link check)
        id: checks
        continue-on-error: true
        run: python scripts/autocheck.py --links

      - name: Build public catalog (publication gate + transformation)
        run: python scripts/build.py

      - name: Upload check and gate reports
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            data/meta/autocheck_report.json
            data/meta/gate_report.json

      - name: Open an issue if the checks found errors
        if: steps.checks.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('data/meta/autocheck_report.json','utf8'));
            const errs = r.findings.filter(f => f.level === 'ERROR');
            const body = `autocheck found **${errs.length} errors** and ${r.warnings} warnings on ${r.checked_at}.\n\n` +
              errs.slice(0,60).map(f => `- \`${f.code}\` ${f.pid||''} ${f.oid||''} — ${f.msg}`).join('\n') +
              (errs.length>60 ? `\n\n…and ${errs.length-60} more (see the reports artifact).` : '');
            const title = 'autocheck: data errors need review';
            const open = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'autocheck'});
            if (open.data.length) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: open.data[0].number, body});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['autocheck']});
            }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
